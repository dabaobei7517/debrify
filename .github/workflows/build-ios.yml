name: Debrify Chinese iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debrify-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build Unsigned iOS IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Show build environment
        run: |
          flutter --version
          xcodebuild -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Verify iOS project
        run: |
          test -f pubspec.yaml
          test -d ios
          test -f ios/Runner.xcodeproj/project.pbxproj

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="build/ios/iphoneos/Runner.app"
          PACKAGE_DIR="dist/Payload"
          IPA_PATH="dist/Debrify-Chinese-Unsigned.ipa"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Build output Runner.app not found"
            exit 1
          fi

          rm -rf dist
          mkdir -p "$PACKAGE_DIR"

          ditto "$APP_PATH" "$PACKAGE_DIR/Runner.app"

          (
            cd dist
            /usr/bin/zip -qry \
              Debrify-Chinese-Unsigned.ipa Payload
          )

          test -s "$IPA_PATH"
          /usr/bin/unzip -t "$IPA_PATH"

          echo "IPA generated successfully"
          ls -lh "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Debrify-Chinese-Unsigned-IPA
          path: dist/Debrify-Chinese-Unsigned.ipa
          if-no-files-found: error
          retention-days: 14
