name: Build Chinese iOS IPA (Final Ultimate Edition)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Translate & Build Final IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: 1. Checkout code
      uses: actions/checkout@v4

    - name: 2. Configure TMDB build token (Auto-fallback if empty)
      shell: python
      env:
        TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      run: |
        import json, os
        from pathlib import Path
        token = os.environ.get("TMDB_READ_ACCESS_TOKEN", "").strip() or "eyJhbGciOiJIUzI1NiJ9"
        config = Path(os.environ["RUNNER_TEMP"]) / "debrify-build-config.json"
        config.write_text(json.dumps({"TMDB_READ_ACCESS_TOKEN": token}), encoding="utf-8")

    - name: 3. Safe & Comprehensive UI Translation
      shell: python
      run: |
        import glob
        import re

        # Debrify 全应用核心 UI 词典（覆盖设置、账号、播放源、详情、列表、弹窗）
        translations = {
            # 基础操作与通用
            "Settings": "设置",
            "Home": "首页",
            "Search": "搜索",
            "Library": "媒体库",
            "Favorites": "收藏",
            "Watchlist": "想看列表",
            "History": "历史记录",
            "Downloads": "下载管理",
            "Save": "保存",
            "Cancel": "取消",
            "Clear": "清除",
            "Delete": "删除",
            "Reset": "重置",
            "Confirm": "确认",
            "Close": "关闭",
            "Back": "返回",
            "Loading...": "加载中...",
            "No results found": "未找到相关结果",
            "Success": "成功",
            "Saved successfully": "保存成功",

            # 账号与 Debrid 服务商
            "Account & Debrid": "账号与 Debrid 服务",
            "Debrid Service": "Debrid 服务商",
            "API Key": "API 密钥",
            "Enter your API Key": "输入你的 API 密钥",
            "Enter your Real-Debrid API Key": "输入你的 Real-Debrid API 密钥",
            "Enter your TorBox API Key": "输入你的 TorBox API 密钥",
            "Enter your AllDebrid API Key": "输入你的 AllDebrid API 密钥",
            "Connected": "已连接",
            "Disconnected": "未连接",
            "Connect": "连接",
            "Disconnect": "断开连接",
            "API Key saved": "API 密钥已保存",

            # 播放源与资源选择（Debrify 最核心部分）
            "Sources": "播放源",
            "Streams": "视频流",
            "Cached": "已缓存 (秒播)",
            "Uncached": "未缓存",
            "Cached Only": "仅显示已缓存资源",
            "Show Cached Only": "仅显示已缓存资源",
            "Include Uncached": "包含未缓存资源",
            "Seeders": "做种数",
            "Size": "文件大小",
            "Quality": "画质优先",
            "Resolution": "分辨率",
            "Filter out cams": "过滤枪版 (CAM)",
            "Exclude 3D": "排除 3D 资源",

            # 影视详情与播放控制
            "Continue Watching": "继续观看",
            "Trending": "热门趋势",
            "Popular": "流行",
            "Top Rated": "高分评价",
            "Movies": "电影",
            "TV Shows": "电视剧",
            "Seasons": "季",
            "Episodes": "集",
            "Overview": "剧情简介",
            "Cast": "演员表",
            "Play": "播放",
            "Trailer": "预告片",
            "Add to Watchlist": "加入想看列表",
            "Remove from Watchlist": "从想看列表移除",
            "Mark as Watched": "标记为已看",
            "Mark as Unwatched": "标记为未看",
            "Playback": "播放设置",
            "Player": "播放器设置",
            "Default Player": "默认播放器",
            "Internal Player": "内置播放器",
            "External Player": "外部播放器",
            "Auto Play": "自动播放",
            "Auto-play next episode": "自动播放下一集",
            "Auto Select Source": "自动选择播放源",
            "Hardware Acceleration": "硬件加速",
            "Skip Intro": "跳过片头",
            "Skip Outro": "跳过片尾",
            "Seek Duration": "快进/快退时长",
            "Resume Playback": "恢复播放进度",

            # 字幕与扩展
            "Subtitles": "字幕设置",
            "Enable Subtitles": "启用字幕",
            "Subtitle Size": "字幕大小",
            "Subtitle Color": "字幕颜色",
            "Subtitle Background": "字幕背景",
            "Indexers": "索引器",
            "Addons": "扩展插件",
            "Torrentio": "Torrentio 插件",
            "Max Results": "最大结果数量",
            "Sort By": "排序方式",

            # 直播播放列表
            "Playlists": "播放列表",
            "Channels": "电视直播频道",
            "EPG": "电子节目单",
            "Refresh Playlist": "刷新播放列表",
            "Auto Refresh": "自动刷新",

            # 外观与常规设置
            "General": "常规设置",
            "Appearance": "外观与主题",
            "Theme": "主题模式",
            "Dark Mode": "深色模式",
            "Light Mode": "浅色模式",
            "System Default": "跟随系统",
            "AMOLED Dark": "纯黑模式 (AMOLED)",
            "Accent Color": "强调色",
            "Layout": "界面布局",

            # 同步与缓存
            "Sync": "同步",
            "Sync & Backup": "同步与备份",
            "Backup & Restore": "备份与恢复",
            "Export Settings": "导出设置",
            "Import Settings": "导入设置",
            "Trakt": "Trakt 追剧同步",
            "Connect Trakt": "连接 Trakt 账号",
            "Cache Management": "缓存管理",
            "Clear Cache": "清除缓存",
            "Cache cleared": "缓存已清除",
            "Clear Search History": "清除搜索历史",
            "Clear Watch History": "清除观看历史",

            # 关于
            "About": "关于",
            "Version": "当前版本",
            "Check for Updates": "检查更新",
            "Up to date": "已是最新版本",
            "Update Available": "发现新版本",
            "GitHub Repository": "GitHub 源码仓库",
            "Report an Issue": "反馈问题",
            "License": "开源许可"
        }

        # 扫描 lib 下所有 dart 文件
        files = glob.glob("lib/**/*.dart", recursive=True)
        count = 0

        # 安全的前缀匹配正则：只翻译 UI 控件里的文本，绝不破坏内部逻辑 Key
        prefix_pattern = re.compile(
            r"(\b(?:Text|SelectableText)\s*\(\s*|\b(?:title|subtitle|label|labelText|hintText|helperText|tooltip|text|emptyMessage|description|header)\s*:\s*)(['\"])(.*?)\2",
            re.DOTALL
        )

        for filepath in files:
            with open(filepath, "r", encoding="utf-8") as f:
                content = f.read()

            original_content = content

            def replacer(match):
                prefix = match.group(1)
                quote = match.group(2)
                text = match.group(3)
                # 如果文本精确命中我们字典里的英文，则替换为中文
                if text in translations:
                    return f"{prefix}{quote}{translations[text]}{quote}"
                return match.group(0)

            new_content = prefix_pattern.sub(replacer, content)

            if new_content != original_content:
                with open(filepath, "w", encoding="utf-8") as f:
                    f.write(new_content)
                count += 1
                print(f"Safely Translated UI in: {filepath}")

        print(f"Total modified files: {count}")

    - name: 4. Setup Flutter (Pinned 3.44.8)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: 5. Get dependencies
      run: flutter pub get

    - name: 6. Build iOS (unsigned)
      run: flutter build ios --release --dart-define=DEBRIFY_LOCAL_VALIDATION=false --no-codesign --dart-define-from-file="${{ runner.temp }}/debrify-build-config.json"

    - name: 7. Ad-hoc sign for sideloading
      run: |
        set -euo pipefail
        APP=build/ios/iphoneos/Runner.app
        for d in "$APP"/Frameworks/*.dylib; do
          [ -f "$d" ] && codesign -f -s - --timestamp=none "$d"
        done
        for f in "$APP"/Frameworks/*.framework; do
          [ -d "$f" ] && codesign -f -s - --timestamp=none "$f"
        done
        codesign -f -s - --timestamp=none "$APP"

        missing=0
        check() {
          if [ -f "$1" ] && [ "$(otool -l "$1" | grep -c LC_CODE_SIGNATURE)" -eq 0 ]; then
            echo "::error::no LC_CODE_SIGNATURE in $1"
            missing=$((missing + 1))
          fi
        }
        check "$APP/Runner"
        for d in "$APP"/Frameworks/*.dylib; do check "$d"; done
        for f in "$APP"/Frameworks/*.framework; do
          check "$f/$(basename "$f" .framework)"
        done
        if [ "$missing" -ne 0 ]; then
          echo "::error::$missing binary(ies) left unsigned; IPA would not sideload"
          exit 1
        fi
        echo "all binaries carry LC_CODE_SIGNATURE"

    - name: 8. Create unsigned IPA
      run: |
        cd build/ios/iphoneos
        mkdir -p Payload
        cp -R Runner.app Payload/
        zip -r debrify-zh-unsigned.ipa Payload
        rm -rf Payload

    - name: 9. Upload IPA as artifact
      uses: actions/upload-artifact@v4
      with:
        name: debrify-ios-zh
        path: build/ios/iphoneos/debrify-zh-unsigned.ipa
