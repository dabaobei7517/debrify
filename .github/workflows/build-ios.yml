name: Build Chinese iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Translate Settings & Build IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: 1. Checkout code
      uses: actions/checkout@v4

    - name: 2. Configure TMDB build token (Auto-fallback if empty)
      shell: python
      env:
        TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      run: |
        import json, os
        from pathlib import Path
        token = os.environ.get("TMDB_READ_ACCESS_TOKEN", "").strip() or "eyJhbGciOiJIUzI1NiJ9"
        config = Path(os.environ["RUNNER_TEMP"]) / "debrify-build-config.json"
        config.write_text(json.dumps({"TMDB_READ_ACCESS_TOKEN": token}), encoding="utf-8")

    - name: 3. Install Translator & Full Translate Settings
      run: |
        pip3 install deep-translator
        python3 - << 'EOF'
        import glob
        import re
        from deep_translator import GoogleTranslator

        translator = GoogleTranslator(source='en', target='zh-CN')
        cache = {}

        # 核心高频术语优先精确映射（保证专业词汇翻译地道）
        exact_dict = {
            "Settings": "设置",
            "Playback": "播放设置",
            "Subtitles": "字幕设置",
            "Appearance": "外观与主题",
            "Sources": "播放源",
            "Addons": "扩展插件",
            "Indexers": "索引器",
            "Downloads": "下载管理",
            "Playlists": "播放列表",
            "General": "常规设置",
            "About": "关于",
            "Save": "保存",
            "Cancel": "取消",
            "Delete": "删除",
            "Clear": "清除",
            "Reset": "重置",
            "Cached Only": "仅显示已缓存资源",
            "Seeders": "做种数",
            "Default Player": "默认播放器",
            "Internal Player": "内置播放器",
            "External Player": "外部播放器",
        }

        def should_translate(s):
            s_strip = s.strip()
            if len(s_strip) < 2:
                return False
            # 排除含代码插值、路径、URL、键名格式的字符串，确保绝不改坏代码逻辑
            if any(x in s_strip for x in ['$', '{', '}', 'http://', 'https://', 'assets/', '/', '_', '.dart', '.json']):
                return False
            # 必须包含英文字母
            if not re.search(r'[A-Za-z]{2,}', s_strip):
                return False
            # 保留专有名词不乱翻
            if s_strip in {'Real-Debrid', 'TorBox', 'AllDebrid', 'Premiumize', 'Trakt', 'Stremio', 'Torrentio', 'TMDB', 'Debrify', 'WebDAV', 'MPV', 'VLC', 'Infuse', 'Outplayer', 'VidHub', 'SenPlayer'}:
                return False
            return True

        def translate_text(text):
            if text in exact_dict:
                return exact_dict[text]
            if text in cache:
                return cache[text]
            try:
                zh = translator.translate(text)
                if zh:
                    # 避免翻译结果中出现破坏 Dart 字符串的引号
                    zh = zh.replace("'", " ").replace('"', " ").replace("\n", " ")
                    cache[text] = zh
                    print(f"  [译] {text}  -->  {zh}")
                    return zh
            except Exception as e:
                print(f"  [跳过] {text}: {e}")
            cache[text] = text
            return text

        # 扫描所有与设置和界面相关的 dart 文件
        files = sorted(set(
            glob.glob("lib/**/*setting*.dart", recursive=True) +
            glob.glob("lib/**/settings/**/*.dart", recursive=True) +
            glob.glob("lib/screens/**/*.dart", recursive=True)
        ))
        print(f"找到 {len(files)} 个界面/设置文件准备汉化...")

        # 匹配 Text('...'), title: '...', subtitle: '...', label: '...', hintText: '...', helperText: '...' 等（支持跨行空白）
        pattern = re.compile(
            r"(\b(?:Text|SelectableText)\s*\(\s*|\b(?:title|subtitle|label|labelText|hintText|helperText|tooltip|text|emptyMessage|description|header)\s*:\s*)(['\"])([^'\"\n]{2,160})\2"
        )

        for filepath in files:
            with open(filepath, "r", encoding="utf-8") as f:
                content = f.read()

            def replacer(match):
                prefix = match.group(1)
                quote = match.group(2)
                eng = match.group(3)
                if should_translate(eng):
                    zh = translate_text(eng)
                    return f"{prefix}{quote}{zh}{quote}"
                return match.group(0)

            new_content = pattern.sub(replacer, content)
            if new_content != content:
                with open(filepath, "w", encoding="utf-8") as f:
                    f.write(new_content)
                print(f"✅ 已完成文件汉化: {filepath}")

        print(f"🎉 全部汉化完成，共翻译了 {len(cache)} 条不同的界面语句！")
        EOF

    - name: 4. Setup Flutter (Pinned 3.44.8)
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: 5. Get dependencies
      run: flutter pub get

    - name: 6. Build iOS (unsigned)
      run: flutter build ios --release --dart-define=DEBRIFY_LOCAL_VALIDATION=false --no-codesign --dart-define-from-file="${{ runner.temp }}/debrify-build-config.json"

    - name: 7. Ad-hoc sign for sideloading
      run: |
        set -euo pipefail
        APP=build/ios/iphoneos/Runner.app
        for d in "$APP"/Frameworks/*.dylib; do
          [ -f "$d" ] && codesign -f -s - --timestamp=none "$d"
        done
        for f in "$APP"/Frameworks/*.framework; do
          [ -d "$f" ] && codesign -f -s - --timestamp=none "$f"
        done
        codesign -f -s - --timestamp=none "$APP"

        missing=0
        check() {
          if [ -f "$1" ] && [ "$(otool -l "$1" | grep -c LC_CODE_SIGNATURE)" -eq 0 ]; then
            echo "::error::no LC_CODE_SIGNATURE in $1"
            missing=$((missing + 1))
          fi
        }
        check "$APP/Runner"
        for d in "$APP"/Frameworks/*.dylib; do check "$d"; done
        for f in "$APP"/Frameworks/*.framework; do
          check "$f/$(basename "$f" .framework)"
        done
        if [ "$missing" -ne 0 ]; then
          echo "::error::$missing binary(ies) left unsigned; IPA would not sideload"
          exit 1
        fi
        echo "all binaries carry LC_CODE_SIGNATURE"

    - name: 8. Create unsigned IPA
      run: |
        cd build/ios/iphoneos
        mkdir -p Payload
        cp -R Runner.app Payload/
        zip -r debrify-zh-unsigned.ipa Payload
        rm -rf Payload

    - name: 9. Upload IPA as artifact
      uses: actions/upload-artifact@v4
      with:
        name: debrify-ios-zh
        path: build/ios/iphoneos/debrify-zh-unsigned.ipa
