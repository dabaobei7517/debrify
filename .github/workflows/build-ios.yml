name: Build Chinese iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Translate Settings & Build IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v5

      - name: 2. Translate Settings Screen
        shell: python3 {0}
        run: |
          import glob
          import re

          translations = {
              "Settings": "设置",
              "Account & Debrid": "账号与 Debrid 服务",
              "Debrid Service": "Debrid 服务商",
              "API Key": "API 密钥",
              "Enter your API Key": "输入你的 API 密钥",
              "Enter your Real-Debrid API Key": "输入你的 Real-Debrid API 密钥",
              "Enter your TorBox API Key": "输入你的 TorBox API 密钥",
              "Save": "保存",
              "Cancel": "取消",
              "Clear": "清除",
              "Delete": "删除",
              "Reset": "重置",
              "Saved successfully": "保存成功",
              "API Key saved": "API 密钥已保存",
              "Playback": "播放设置",
              "Player": "播放器",
              "Player Settings": "播放器设置",
              "Default Player": "默认播放器",
              "Internal Player": "内置播放器",
              "External Player": "外部播放器",
              "Auto Play": "自动播放",
              "Auto-play next episode": "自动播放下一集",
              "Auto Select Source": "自动选择播放源",
              "Preferred Quality": "首选画质",
              "Preferred Audio Language": "首选音频语言",
              "Preferred Subtitle Language": "首选字幕语言",
              "Subtitles": "字幕设置",
              "Enable Subtitles": "启用字幕",
              "Subtitle Size": "字幕大小",
              "Subtitle Color": "字幕颜色",
              "Subtitle Background": "字幕背景",
              "Hardware Acceleration": "硬件加速",
              "Skip Intro": "跳过片头",
              "Skip Outro": "跳过片尾",
              "Seek Duration": "快进/快退时长",
              "Resume Playback": "恢复播放进度",
              "Continue Watching": "继续观看",
              "Sources": "资源与插件源",
              "Indexers": "索引器 (Indexers)",
              "Addons": "扩展插件 (Addons)",
              "Torrentio": "Torrentio 插件",
              "Max Results": "最大结果数量",
              "Sort By": "排序方式",
              "Seeders": "做种数 (Seeders)",
              "Size": "文件大小",
              "Quality": "画质优先",
              "Cached Only": "仅显示已缓存资源 (秒播)",
              "Show Cached Only": "仅显示已缓存资源",
              "Uncached": "未缓存",
              "Cached": "已缓存",
              "Include Uncached": "包含未缓存资源",
              "Filter out cams": "过滤枪版 (CAM) 资源",
              "Exclude 3D": "排除 3D 资源",
              "HDR / Dolby Vision": "HDR / 杜比视界",
              "Playlists": "播放列表",
              "Channels": "电视直播频道",
              "EPG": "电子节目单 (EPG)",
              "Refresh Playlist": "刷新播放列表",
              "Auto Refresh": "自动刷新",
              "General": "常规设置",
              "Appearance": "外观与主题",
              "Theme": "主题模式",
              "Dark Mode": "深色模式",
              "Light Mode": "浅色模式",
              "System Default": "跟随系统",
              "AMOLED Dark": "纯黑模式 (AMOLED)",
              "Accent Color": "强调色",
              "Layout": "界面布局",
              "Grid Size": "海报网格大小",
              "Show Posters": "显示海报",
              "Sync": "同步",
              "Sync & Backup": "同步与备份",
              "Backup & Restore": "备份与恢复",
              "Export Settings": "导出设置",
              "Import Settings": "导入设置",
              "Trakt": "Trakt 追剧同步",
              "Connect Trakt": "连接 Trakt 账号",
              "Disconnect": "断开连接",
              "Cache": "缓存管理",
              "Clear Cache": "清除缓存",
              "Cache cleared": "缓存已清除",
              "Clear Search History": "清除搜索历史",
              "Clear Watch History": "清除观看历史",
              "Downloads": "下载管理",
              "Download Location": "下载保存位置",
              "About": "关于",
              "Version": "当前版本",
              "Check for Updates": "检查更新",
              "Up to date": "已是最新版本",
              "Update Available": "发现新版本",
              "GitHub Repository": "GitHub 源码仓库",
              "Report an Issue": "反馈问题",
              "License": "开源许可"
          }

          files = set(glob.glob("lib/**/*setting*.dart", recursive=True) + glob.glob("lib/screens/**/*.dart", recursive=True))
          print(f"Found {len(files)} target files.")

          sorted_keys = sorted(translations.keys(), key=len, reverse=True)

          for filepath in files:
              with open(filepath, "r", encoding="utf-8") as f:
                  content = f.read()

              original = content
              for en in sorted_keys:
                  zh = translations[en]
                  ui_pattern_single = rf"(Text\(\s*|title:\s*|subtitle:\s*|label:\s*|labelText:\s*|hintText:\s*|tooltip:\s*|text:\s*)'{re.escape(en)}'"
                  ui_pattern_double = rf'(Text\(\s*|title:\s*|subtitle:\s*|label:\s*|labelText:\s*|hintText:\s*|tooltip:\s*|text:\s*)"{re.escape(en)}"'
                  content = re.sub(ui_pattern_single, rf"\1'{zh}'", content)
                  content = re.sub(ui_pattern_double, rf'\1"{zh}"', content)

              if content != original:
                  with open(filepath, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Translated: {filepath}")

      - name: 3. Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Install Flutter Dependencies
        run: flutter pub get

      - name: 5. Build iOS Application (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: 6. Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 debrify-ios-zh-unsigned.ipa Payload
          ls -lh debrify-ios-zh-unsigned.ipa

      - name: 7. Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debrify-ios-zh-unsigned
          path: debrify-ios-zh-unsigned.ipa
          retention-days: 7
